name: Publish GitHub Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing verified version tag
        required: true
        default: v0.1.0
        type: string

permissions:
  contents: write

concurrency:
  group: github-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag input
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:client
      - run: git diff --exit-code -- client.js dist
      - run: npm test
      - name: Package verified source
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          test "v$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')" = "$RELEASE_TAG"
          mkdir -p release-assets
          npm pack --ignore-scripts --pack-destination release-assets
          cp docs/acceptance-summary.json release-assets/acceptance-summary.json
          cd release-assets
          sha256sum *.tgz acceptance-summary.json > SHA256SUMS
      - name: Publish release and assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --verify-tag --title "$RELEASE_TAG — DeepSeek Harness 文献研究插件" \
              --notes-file "docs/release-$RELEASE_TAG.md" --latest
          fi
